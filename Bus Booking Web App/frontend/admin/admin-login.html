</head>

<body>

    <!-- =====================================================
         ADMIN LOGIN MAIN SECTION
         ===================================================== -->
    <main>

        <section class="admin-login-page">

            <div class="admin-login-brand">
                <!-- BusGo <span>Admin</span> -->
            </div>

            <!-- Login Card -->
            <div class="admin-login-card">

                <!-- Login Heading -->
                <h1>
                    Admin Login
                </h1>

                <!-- Login Description -->
                <p>
                    Login to manage buses, bookings and users.
                </p>


                <!-- =================================================
                     ADMIN LOGIN FORM
                     ================================================= -->
                <form id="adminLoginForm" class="admin-login-form">

                    <!-- Email -->
                    <div class="admin-form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email" id="email" name="email" placeholder="Enter admin email" required>

                    </div>



                    <!-- Password -->
                    <div class="admin-form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="admin-password-wrapper">

                            <input type="password" id="password" name="password" placeholder="Enter admin password"
                                required>

                            <button type="button" id="toggleAdminPassword" class="password-toggle"
                                aria-label="Show password">
                                👁️
                            </button>

                        </div>

                    </div>


                    <!-- Login Message
                         JavaScript can display error/success here -->
                    <p id="adminLoginMessage" class="admin-login-message">
                    </p>


                    <!-- Login Button -->
                    <button type="submit" class="admin-login-button">
                        Admin Login
                    </button>

                </form>


                <!-- Back to User Login -->
                <!-- <a href="../login.html" class="admin-back-link">
                    User Login
                </a> -->

            </div>

            <div class="admin-login-copyright">
                <!-- © 2026 BusGo. All Rights Reserved. -->
            </div>

        </section>

    </main>
