<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusGo - Login</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="css/common.css">

    <!-- Login Page CSS -->
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <!-- =====================================================
     HEADER
     Common header used across the website
     ===================================================== -->
    <!-- <header>

        <div class="header-container"> -->

    <!-- Website Logo -->
    <!-- <h2 class="logo">BusGo</h2>

        </div> -->

    <!-- </header> -->


    <!-- =====================================================
     MAIN LOGIN AREA
     ===================================================== -->
    <main>

        <section class="login-page">

            <div class="login-brand">
                <!-- BusGo -->
            </div>
            <!-- <span>User</span> -->
            <div class="login-container">

                <!-- Login Card -->
                <div class="login-card">

                    <!-- Heading -->
                    <h1>Welcome Back</h1>

                    <p class="login-description">
                        Login to your BusGo account and manage your bookings.
                    </p>


                    <!-- Login Message
                     JavaScript will use this later
                     for error/success messages -->
                    <div id="loginMessage" class="login-message"></div>


                    <!-- =================================================
                     LOGIN FORM
                     ================================================= -->
                    <form id="loginForm" class="login-form">

                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">Email</label>

                            <input type="email" id="email" name="email" placeholder="Enter your email" required>

                        </div>


                        <!-- Password -->
                        <!-- <div class="form-group">

                            <label for="password">Password</label>

                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                required>

                        </div> -->

                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="password-wrapper">

                                <input type="password" id="password" name="password" placeholder="Enter your password"
                                    required>

                                <button type="button" class="password-toggle" id="passwordToggle"
                                    aria-label="Show password">
                                    👁
                                </button>

                            </div>

                        </div>


                        <!-- Remember Me -->
                        <!-- <div class="remember-row">

                            <div class="remember-me">

                                <input type="checkbox" id="rememberMe" name="rememberMe">

                                <label for="rememberMe">
                                    Remember me
                                </label>

                            </div> -->

                        <!-- Forgot password
                             Backend functionality can be added later -->
                        <!-- <a href="#" class="forgot-password">
                                Forgot Password?
                            </a>

                        </div> -->


                        <!-- Login Button -->
                        <button type="submit" class="login-button">
                            Login
                        </button>

                    </form>


                    <!-- Register Link -->
                    <p class="register-link">

                        Don't have an account?

                        <a href="register.html">
                            Create an account
                        </a>

                    </p>

                </div>

            </div>

            <div class="login-copyright">
                <!-- © 2026 BusGo. All Rights Reserved. -->
            </div>

        </section>

    </main>


    <!-- =====================================================
     FOOTER
     ===================================================== -->
    <!-- <footer>

        <div class="footer-container">

            <p>
                © 2026 BusGo. All Rights Reserved.
            </p>

        </div>

    </footer> -->

    <!-- Login JavaScript -->
    <script src="js/login.js"></script>
</body>

</html>
